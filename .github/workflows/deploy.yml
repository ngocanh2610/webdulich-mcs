name: CI/CD Test & Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - ngocanh
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Playwright E2E & API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Prepare Environment & Upload Permissions
        run: |
          cp .env.example .env
          sed -i 's/JWT_SECRET=.*/JWT_SECRET=ci_playwright_jwt_secret_2026/' .env
          sed -i 's/GEMINI_API_KEY=.*/GEMINI_API_KEY=/' .env
          echo "DB_PASSWORD=root1234" >> .env
          mkdir -p media-service/uploads
          chmod -R 777 media-service/uploads

      - name: Start Microservices Stack with Docker Compose
        run: docker compose up -d --build

      - name: Wait for API Gateway & MySQL Data Seeding
        run: |
          echo "⏳ Đang chờ toàn bộ Microservices và MySQL khởi tạo dữ liệu..."
          for i in $(seq 1 60); do
            HEALTH=$(curl -sf http://localhost:2222/health || true)
            PROV_COUNT=$(curl -sf "http://localhost:2222/api/provinces?mode=34" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).data.length)}catch{console.log(0)}})" || echo 0)
            LOC_COUNT=$(curl -sf "http://localhost:2222/api/locations" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).data.length)}catch{console.log(0)}})" || echo 0)
            if [ -n "$HEALTH" ] && [ "$PROV_COUNT" = "34" ] && [ "$LOC_COUNT" -gt 0 ] 2>/dev/null; then
              echo "✅ Hệ thống sẵn sàng! (Provinces 34: $PROV_COUNT, Locations: $LOC_COUNT)"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "❌ Quá thời gian chờ khởi động hệ thống!"
              docker compose ps
              docker compose logs --tail=100
              exit 1
            fi
            sleep 3
          done

      - name: Seed E2E Test Accounts (Admin & User)
        run: |
          sleep 2
          docker exec -i vn-tourism-users node - << 'EOF'
          const bcrypt = require('bcryptjs');
          const mysql = require('mysql2/promise');
          (async () => {
            const conn = await mysql.createConnection({
              host: process.env.DB_HOST || 'mysql-db',
              user: process.env.DB_USER || 'root',
              password: process.env.DB_PASSWORD || 'root1234',
              database: process.env.DB_NAME || 'vntourism'
            });
            const adminHash = await bcrypt.hash('E2eAdmin123!', 10);
            const userHash = await bcrypt.hash('E2eUser123!', 10);
            await conn.execute(
              `INSERT INTO users (id, username, email, password, role, status, created_at)
               VALUES ('e2e-admin-id', 'e2e_admin', 'e2e_admin@test.local', ?, 'admin', 'active', NOW())
               ON DUPLICATE KEY UPDATE password = VALUES(password), role = 'admin', status = 'active'`,
              [adminHash]
            );
            await conn.execute(
              `INSERT INTO users (id, username, email, password, role, status, created_at)
               VALUES ('e2e-user-id', 'e2e_user', 'e2e_user@test.local', ?, 'user', 'active', NOW())
               ON DUPLICATE KEY UPDATE password = VALUES(password), role = 'user', status = 'active'`,
              [userHash]
            );
            await conn.end();
            console.log('✅ Đã tạo tài khoản kiểm thử e2e_admin & e2e_user');
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Install Playwright & Headless Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E & API Test Suite
        working-directory: e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:2222
          E2E_ADMIN_USER: e2e_admin
          E2E_ADMIN_PASS: E2eAdmin123!
          E2E_USER_USER: e2e_user
          E2E_USER_PASS: E2eUser123!
        run: npx playwright test

      - name: Print Container Logs on Failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=100

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

      - name: Stop & Cleanup Docker Containers
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to AWS EC2
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "🚀 [CI/CD] Bat dau qua trinh cap nhat he thong tren EC2..."
            
            # Kiem tra thu muc du an
            PROJECT_DIR="$HOME/webdulich-mcs"
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "⚠️ Thu muc $PROJECT_DIR chua ton tai, tien hanh clone..."
              git clone https://github.com/ngocanh2610/webdulich-mcs.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"

            # Keo code moi nhat ve
            echo "📥 Dang pull code moi tu branch main..."
            git fetch origin main
            git reset --hard origin/main

            # Khoi chay container voi docker compose
            echo "🐳 Dang build va khoi dong lai container..."
            docker compose up -d --build --remove-orphans

            # Don dep image khong su dung de giai phong o dia
            echo "🧹 Don dep bo nho dem Docker..."
            docker image prune -f

            # Reload Nginx host neu co
            sudo systemctl reload nginx 2>/dev/null || true

            echo "✅ [CI/CD] Deploy thanh cong len https://ngoccanhh2610.id.vn !"
