version: '3.8'

services:
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: vn-tourism-gateway
    ports:
      - "2222:80"
    depends_on:
      - frontend
      - province-service
      - location-service
      - media-service
      - ai-service
      - user-service
    networks:
      - vietnam-tourism-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-290652647677-hm7715ipm0ufh8c5lck7vc59qjq80jna.apps.googleusercontent.com}
    container_name: vn-tourism-frontend
    env_file:
      - .env
    expose:
      - "80"
    networks:
      - vietnam-tourism-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  province-service:
    build:
      context: ./province-service
      dockerfile: Dockerfile
    container_name: vn-tourism-provinces
    expose:
      - "3001"
    networks:
      - vietnam-tourism-net
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=host.docker.internal
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=vntourism
      - DB_PORT=3306
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s

  location-service:
    build:
      context: ./location-service
      dockerfile: Dockerfile
    container_name: vn-tourism-locations
    expose:
      - "3002"
    networks:
      - vietnam-tourism-net
    volumes:
      - ./location-service/data:/app/data
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DB_HOST=host.docker.internal
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=vntourism
      - DB_PORT=3306
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s

  media-service:
    build:
      context: ./media-service
      dockerfile: Dockerfile
    container_name: vn-tourism-media
    expose:
      - "3003"
    networks:
      - vietnam-tourism-net
    volumes:
      - ./media-service/uploads:/app/uploads
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3003
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: vn-tourism-ai
    expose:
      - "3004"
    networks:
      - vietnam-tourism-net
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3004
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3004/health || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: vn-tourism-users
    expose:
      - "3005"
    networks:
      - vietnam-tourism-net
    volumes:
      - ./user-service/data:/app/data
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DB_HOST=host.docker.internal
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=vntourism
      - DB_PORT=3306
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3005/health || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  vietnam-tourism-net:
    driver: bridge
    name: vietnam-tourism-net
